<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <!-- Duelist Amber Cape -->
    <linearGradient id="duelistCape" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d35400" />
      <stop offset="100%" stop-color="#6e2c00" />
    </linearGradient>
    <linearGradient id="rapierSteel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#bdc3c7" />
      <stop offset="100%" stop-color="#7f8c8d" />
    </linearGradient>
  </defs>

  <!-- 1. Drop Shadow under feet -->
  <ellipse cx="32" cy="58" rx="15" ry="4.5" fill="rgba(0, 0, 0, 0.65)" />

  <!-- 2. Duelist Half-Cape (Billowing Right) -->
  <path d="M26 24 Q18 36 20 52 Q30 48 34 50 Q30 36 28 24 Z" fill="url(#duelistCape)" stroke="#4e1f00" stroke-width="1" />

  <!-- 3. Leather Trousers & Riding Boots -->
  <rect x="25" y="45" width="5.5" height="12" rx="2" fill="#2c1a0f" stroke="#120a06" stroke-width="1" />
  <rect x="33.5" y="45" width="5.5" height="12" rx="2" fill="#382113" stroke="#120a06" stroke-width="1" />
  <ellipse cx="27" cy="56" rx="3.5" ry="2" fill="#1c1009" />
  <ellipse cx="36" cy="56" rx="3.5" ry="2" fill="#1c1009" />

  <!-- 4. Tailored Fencing Doublet (Torso) -->
  <path d="M22 22 H42 L40 44 H24 Z" fill="#784212" stroke="#3e1f05" stroke-width="1.5" />
  <!-- Doublet Brass Buttons -->
  <line x1="32" y1="23" x2="32" y2="43" stroke="#d4ac0d" stroke-width="1" />
  <circle cx="32" cy="27" r="1" fill="#f1c40f" />
  <circle cx="32" cy="33" r="1" fill="#f1c40f" />
  <circle cx="32" cy="39" r="1" fill="#f1c40f" />

  <!-- 5. Head & Feathered Cavalier Cap -->
  <ellipse cx="32" cy="16" rx="7" ry="8" fill="#d7bde2" />
  <!-- Hair & Eyes -->
  <path d="M25 15 Q32 10 39 15 Q38 18 32 18 Q26 18 25 15 Z" fill="#2c1e14" />
  <circle cx="29" cy="16" r="0.9" fill="#1c2833" />
  <circle cx="35" cy="16" r="0.9" fill="#1c2833" />
  <!-- Cavalier Hat -->
  <ellipse cx="32" cy="12" rx="9" ry="3.5" fill="#4a2810" stroke="#231206" stroke-width="1" />
  <path d="M28 12 Q36 4 42 10" fill="none" stroke="#e67e22" stroke-width="2" stroke-linecap="round" />

  <!-- 6. Steel Rapier (Extended in Fighting Guard) -->
  <g transform="rotate(-25 46 32)">
    <!-- Thin Needle Blade -->
    <line x1="46" y1="2" x2="46" y2="38" stroke="url(#rapierSteel)" stroke-width="1.5" stroke-linecap="round" />
    <line x1="46" y1="2" x2="46" y2="34" stroke="#ffffff" stroke-width="0.8" />
    <!-- Cup Guard / Hilt -->
    <ellipse cx="46" cy="38" rx="4.5" ry="3" fill="#d4ac0d" stroke="#7d6608" stroke-width="0.8" />
    <rect x="44.5" y="40" width="3" height="6" rx="0.5" fill="#4a2810" />
    <circle cx="46" cy="47" r="1.8" fill="#f1c40f" />
  </g>
</svg>
