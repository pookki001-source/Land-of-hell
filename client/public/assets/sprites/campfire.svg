<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <defs>
    <!-- Fire Flame Glow -->
    <radialGradient id="fireGlow" cx="50%" cy="55%" r="48%">
      <stop offset="0%" stop-color="#fff7b0" />
      <stop offset="25%" stop-color="#f39c12" />
      <stop offset="65%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#922b21" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 1. Soft Warm Ground Ember Light -->
  <circle cx="48" cy="52" r="38" fill="url(#fireGlow)" opacity="0.6" />

  <!-- 2. Stone Pit Ring -->
  <ellipse cx="48" cy="58" rx="34" ry="20" fill="#14110e" stroke="#2c241c" stroke-width="2" />
  <!-- Individual char stones -->
  <ellipse cx="20" cy="56" rx="6" ry="4" fill="#302820" stroke="#1c1611" stroke-width="1" />
  <ellipse cx="32" cy="72" rx="7" ry="4.5" fill="#352c23" stroke="#1c1611" stroke-width="1" />
  <ellipse cx="50" cy="76" rx="8" ry="4.5" fill="#2d251d" stroke="#1c1611" stroke-width="1" />
  <ellipse cx="68" cy="72" rx="7" ry="4" fill="#362d24" stroke="#1c1611" stroke-width="1" />
  <ellipse cx="78" cy="58" rx="6" ry="4" fill="#2f2720" stroke="#1c1611" stroke-width="1" />
  <ellipse cx="66" cy="44" rx="7" ry="4" fill="#2b231c" stroke="#1c1611" stroke-width="1" />
  <ellipse cx="34" cy="44" rx="7" ry="4" fill="#332b22" stroke="#1c1611" stroke-width="1" />

  <!-- 3. Crossed Charred Wood Logs -->
  <!-- Log 1 (Diagonal Left to Right) -->
  <line x1="26" y1="48" x2="70" y2="64" stroke="#1c140d" stroke-width="7" stroke-linecap="round" />
  <line x1="26" y1="48" x2="70" y2="64" stroke="#332417" stroke-width="5" stroke-linecap="round" />
  <!-- Log 2 (Diagonal Right to Left) -->
  <line x1="68" y1="48" x2="28" y2="64" stroke="#1c140d" stroke-width="7" stroke-linecap="round" />
  <line x1="68" y1="48" x2="28" y2="64" stroke="#382719" stroke-width="5" stroke-linecap="round" />

  <!-- 4. Glowing Embers Bed -->
  <ellipse cx="48" cy="56" rx="14" ry="8" fill="#e74c3c" />
  <ellipse cx="48" cy="55" rx="10" ry="5" fill="#f39c12" />

  <!-- 5. Dancing Fire Tongues -->
  <!-- Back Flame (Red) -->
  <path d="M34 58 Q42 24 48 14 Q54 26 62 58 Q48 64 34 58 Z" fill="#c0392b" opacity="0.9" />
  <!-- Mid Flame (Orange) -->
  <path d="M38 56 Q44 30 48 22 Q52 30 58 56 Q48 60 38 56 Z" fill="#e67e22" />
  <!-- Core Flame (Yellow / White) -->
  <path d="M42 54 Q46 38 48 30 Q50 38 54 54 Q48 57 42 54 Z" fill="#f9e79f" />
  <ellipse cx="48" cy="48" rx="3.5" ry="5.5" fill="#ffffff" />
</svg>
