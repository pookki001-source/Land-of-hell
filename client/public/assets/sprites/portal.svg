  <!-- 3. Rotating Dimensional Vortex -->
  <ellipse cx="48" cy="46" rx="28" ry="34" fill="#000000" stroke="#9b59b6" stroke-width="2.5" />
  <ellipse cx="48" cy="46" rx="20" ry="26" fill="#170326" stroke="#af7ac5" stroke-width="2" />
  <ellipse cx="48" cy="46" rx="12" ry="16" fill="url(#portalVoid)" />
  <ellipse cx="48" cy="46" rx="4" ry="6" fill="#ffffff" />

  <!-- 4. Runic Arcs -->
  <path d="M26 30 Q48 16 70 30" fill="none" stroke="#d7bde2" stroke-width="1.5" stroke-dasharray="4,3" />
  <path d="M26 62 Q48 76 70 62" fill="none" stroke="#d7bde2" stroke-width="1.5" stroke-dasharray="4,3" />
