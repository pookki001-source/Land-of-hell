<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <!-- Steel Armor Gradient -->
    <linearGradient id="armorSteel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#bdc3c7" />
      <stop offset="50%" stop-color="#7f8c8d" />
      <stop offset="100%" stop-color="#34495e" />
    </linearGradient>
    <!-- Crimson Cape Gradient -->
    <linearGradient id="warriorCape" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c0392b" />
      <stop offset="100%" stop-color="#641e16" />
    </linearGradient>
    <!-- Blade Edge Gradient -->
    <linearGradient id="bladeEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ecf0f1" />
      <stop offset="60%" stop-color="#95a5a6" />
      <stop offset="100%" stop-color="#566573" />
    </linearGradient>
  </defs>

  <!-- 1. Drop Shadow under feet -->
  <ellipse cx="32" cy="58" rx="16" ry="5" fill="rgba(0, 0, 0, 0.65)" />

  <!-- 2. Billowing Crimson Battle Cape (Behind Body) -->
  <path d="M22 24 Q14 38 18 54 Q30 52 38 54 Q34 38 32 24 Z" fill="url(#warriorCape)" stroke="#4a1510" stroke-width="1" />

  <!-- 3. Armored Greaves & Boots -->
  <rect x="25" y="46" width="6" height="11" rx="2" fill="#2c3e50" stroke="#1a252f" stroke-width="1" />
  <rect x="33" y="46" width="6" height="11" rx="2" fill="#34495e" stroke="#1a252f" stroke-width="1" />
  <!-- Sabatons (Feet) -->
  <ellipse cx="27" cy="56" rx="4" ry="2.5" fill="#7f8c8d" />
  <ellipse cx="37" cy="56" rx="4" ry="2.5" fill="#95a5a6" />

  <!-- 4. Segmented Plate Cuirass (Torso) -->
  <path d="M22 22 H42 L40 46 H24 Z" fill="url(#armorSteel)" stroke="#1c2833" stroke-width="1.5" />
  <!-- Golden Trim on Breastplate -->
  <path d="M26 24 L32 36 L38 24" fill="none" stroke="#f1c40f" stroke-width="1.2" />
  <!-- War Belt -->
  <rect x="23" y="42" width="18" height="5" rx="1" fill="#4a2311" stroke="#261208" stroke-width="1" />
  <rect x="30" y="42" width="4" height="5" fill="#f1c40f" />

  <!-- 5. Heavy Steel Pauldrons (Shoulders) -->
  <ellipse cx="20" cy="24" rx="6" ry="5" fill="url(#armorSteel)" stroke="#1c2833" stroke-width="1" />
  <ellipse cx="44" cy="24" rx="6" ry="5" fill="url(#armorSteel)" stroke="#1c2833" stroke-width="1" />

  <!-- 6. Steel Helm with Horns & Visor Slit -->
  <ellipse cx="32" cy="15" rx="8" ry="9" fill="url(#armorSteel)" stroke="#1c2833" stroke-width="1.5" />
  <!-- Horn Crest -->
  <path d="M24 13 Q20 5 16 7 Q21 11 25 15" fill="#7f8c8d" stroke="#1a252f" stroke-width="1" />
  <path d="M40 13 Q44 5 48 7 Q43 11 39 15" fill="#7f8c8d" stroke="#1a252f" stroke-width="1" />
  <!-- Glowing Eye Visor Slit -->
  <rect x="27" y="14" width="10" height="2" rx="1" fill="#111" />
  <rect x="28" y="14" width="3" height="1.8" fill="#3498db" />
  <rect x="33" y="14" width="3" height="1.8" fill="#3498db" />

  <!-- 7. Two-Handed Steel Broadsword (Held in Right Hand) -->
  <g transform="rotate(-15 48 32)">
    <!-- Blade -->
    <polygon points="46,4 49,0 52,4 51,36 47,36" fill="url(#bladeEdge)" stroke="#2c3e50" stroke-width="1" />
    <line x1="49" y1="2" x2="49" y2="34" stroke="#ffffff" stroke-width="0.8" opacity="0.8" />
    <!-- Crossguard -->
    <rect x="42" y="36" width="14" height="3" rx="1" fill="#d4ac0d" stroke="#7d6608" stroke-width="0.8" />
    <!-- Grip & Pommel -->
    <rect x="47.5" y="39" width="3" height="8" rx="0.5" fill="#5d4037" />
    <circle cx="49" cy="48" r="2.5" fill="#f1c40f" stroke="#7d6608" stroke-width="0.8" />
  </g>
</svg>
