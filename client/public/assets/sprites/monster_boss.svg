<svg xmlns="http://www.w3.org/2000/svg" width="84" height="96" viewBox="0 0 84 96">
  <defs>
    <!-- Corrupted Demon Flesh -->
    <linearGradient id="bossFlesh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#78281f" />
      <stop offset="50%" stop-color="#512e2b" />
      <stop offset="100%" stop-color="#2c1614" />
    </linearGradient>
    <radialGradient id="bloodEye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#ff0000" />
      <stop offset="100%" stop-color="#900c3f" />
    </radialGradient>
    <linearGradient id="rustedCleaver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a04000" />
      <stop offset="40%" stop-color="#6e2c00" />
      <stop offset="80%" stop-color="#34495e" />
      <stop offset="100%" stop-color="#1b2631" />
    </linearGradient>
  </defs>

  <!-- 1. Colossal Drop Shadow -->
  <ellipse cx="42" cy="88" rx="28" ry="8" fill="rgba(0, 0, 0, 0.75)" />

  <!-- 2. Massive Corrupted Legs -->
  <rect x="26" y="68" width="12" height="20" rx="3" fill="#3b1d1a" stroke="#1d0a08" stroke-width="2" />
  <rect x="46" y="68" width="12" height="20" rx="3" fill="#4a2420" stroke="#1d0a08" stroke-width="2" />
  <ellipse cx="32" cy="87" rx="7" ry="4" fill="#240f0d" />
  <ellipse cx="52" cy="87" rx="7" ry="4" fill="#240f0d" />

  <!-- 3. Heavy Iron Belt & Chain Loincloth -->
  <rect x="22" y="62" width="40" height="9" rx="2" fill="#2c3e50" stroke="#17202a" stroke-width="1.5" />
  <!-- Skull Belt Buckle -->
  <circle cx="42" cy="66" r="4.5" fill="#d5dbdb" stroke="#2c3e50" stroke-width="1" />
  <!-- Ripped Tattered Chainmail Skirt -->
  <path d="M26 71 L30 80 L38 71 L44 82 L52 71 L58 79 L60 71" stroke="#7f8c8d" stroke-width="2" fill="none" />

  <!-- 4. Colossal Muscular Torso -->
  <path d="M16 28 H68 L62 64 H22 Z" fill="url(#bossFlesh)" stroke="#1a0b09" stroke-width="2" />

  <!-- Glowing Eldritch Blood Runes (Chest) -->
  <path d="M34 36 L42 48 L50 36 M42 48 V58 M32 46 H52" stroke="#ff4757" stroke-width="2" stroke-linecap="round" opacity="0.9" />

  <!-- Spiked Iron Pauldron (Left Shoulder) -->
  <ellipse cx="14" cy="30" rx="9" ry="8" fill="#34495e" stroke="#1a252f" stroke-width="2" />
  <polygon points="12,18 16,18 14,8" fill="#7f8c8d" />
  <polygon points="6,24 8,27 0,22" fill="#7f8c8d" />

  <!-- 5. Towering Brute Skull with Corrupted Horns -->
  <ellipse cx="42" cy="20" rx="11" ry="12" fill="url(#bossFlesh)" stroke="#1a0b09" stroke-width="2" />
  <!-- Curling Demonic Horns -->
  <path d="M33 16 Q20 8 14 14 Q22 20 31 22" fill="#1b120c" stroke="#000" stroke-width="1.2" />
  <path d="M51 16 Q64 8 70 14 Q62 20 53 22" fill="#1b120c" stroke="#000" stroke-width="1.2" />
  <!-- Fanged Snarl -->
  <path d="M36 26 Q42 30 48 26" fill="#0d0504" stroke="#000" stroke-width="1" />
  <line x1="39" y1="26" x2="39" y2="29" stroke="#ffffff" stroke-width="1.2" />
  <line x1="42" y1="26" x2="42" y2="29" stroke="#ffffff" stroke-width="1.2" />
  <line x1="45" y1="26" x2="45" y2="29" stroke="#ffffff" stroke-width="1.2" />
  <!-- Piercing Glowing Crimson Eyes -->
  <circle cx="37" cy="18" r="2.5" fill="url(#bloodEye)" />
  <circle cx="47" cy="18" r="2.5" fill="url(#bloodEye)" />

  <!-- 6. Colossal Rusted Meat Cleaver (Right Arm) -->
  <g transform="rotate(20 62 48)">
    <!-- Right Arm -->
    <path d="M60 34 L70 48" stroke="url(#bossFlesh)" stroke-width="8" stroke-linecap="round" />
    <!-- Cleaver Handle -->
    <rect x="68" y="44" width="5" height="20" rx="1" fill="#4a2810" stroke="#1c0f05" stroke-width="1" />
    <!-- Massive Notched Cleaver Blade -->
    <polygon points="66,8 82,14 80,48 66,44" fill="url(#rustedCleaver)" stroke="#1a0e08" stroke-width="2" />
    <!-- Jagged Blade Notches & Blood Stains -->
    <polygon points="81,24 77,26 81,28" fill="#1a0e08" />
    <polygon points="80,34 76,36 80,38" fill="#1a0e08" />
    <path d="M72 16 L76 38" stroke="#900c3f" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  </g>
</svg>
