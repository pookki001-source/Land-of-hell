<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="stoneGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a231d" />
      <stop offset="100%" stop-color="#14110f" />
    </radialGradient>
    <filter id="roughStone">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="3" result="noise" />
      <feColorMatrix type="matrix" values="0.3 0 0 0 0.1  0 0.25 0 0 0.08  0 0 0.2 0 0.06  0 0 0 0.35 0" />
      <feBlend in="SourceGraphic" in2="noise" mode="multiply" />
    </filter>
  </defs>

  <!-- Deep Ground Base -->
  <rect width="256" height="256" fill="#0d0b0a" />

  <!-- Stone Flagstones / Cobbles Layout -->
  <!-- Row 1 -->
  <rect x="4" y="4" width="76" height="58" rx="4" fill="#251f1a" stroke="#120f0e" stroke-width="3" />
  <rect x="84" y="4" width="94" height="58" rx="4" fill="#1e1814" stroke="#120f0e" stroke-width="3" />
  <rect x="182" y="4" width="70" height="58" rx="4" fill="#2a221c" stroke="#120f0e" stroke-width="3" />

  <!-- Row 2 -->
  <rect x="4" y="66" width="120" height="60" rx="4" fill="#201a15" stroke="#120f0e" stroke-width="3" />
  <rect x="128" y="66" width="124" height="60" rx="4" fill="#27211b" stroke="#120f0e" stroke-width="3" />

  <!-- Row 3 -->
  <rect x="4" y="130" width="86" height="58" rx="4" fill="#1b1612" stroke="#120f0e" stroke-width="3" />
  <rect x="94" y="130" width="78" height="58" rx="4" fill="#2b241d" stroke="#120f0e" stroke-width="3" />
  <rect x="176" y="130" width="76" height="58" rx="4" fill="#221c17" stroke="#120f0e" stroke-width="3" />

  <!-- Row 4 -->
  <rect x="4" y="192" width="138" height="60" rx="4" fill="#29221b" stroke="#120f0e" stroke-width="3" />
  <rect x="146" y="192" width="106" height="60" rx="4" fill="#1e1915" stroke="#120f0e" stroke-width="3" />

  <!-- Bevel highlights and moss accents -->
  <path d="M6 6 H78 M86 6 H176 M184 6 H250" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" />
  <path d="M6 68 H122 M130 68 H250" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" />
  <path d="M6 132 H88 M96 132 H170 M178 132 H250" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" />
  <path d="M6 194 H140 M148 194 H250" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" />

  <!-- Subtle Mortar Grime & Cracks -->
  <path d="M42 20 L48 40 L44 54" stroke="#100d0c" stroke-width="1.5" fill="none" opacity="0.6" />
  <path d="M210 145 L204 165 L212 180" stroke="#100d0c" stroke-width="1.5" fill="none" opacity="0.6" />
  <path d="M70 80 L76 105" stroke="#100d0c" stroke-width="1.5" fill="none" opacity="0.5" />
</svg>
